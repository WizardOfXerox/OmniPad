name: OmniPad CI & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. PC SERVER & UNIT TESTS (WINDOWS .NET 8)
  # =========================================================================
  build-pc-server:
    name: Build PC Server (Windows x64) & Run Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build PCServer Solution (Release)
        run: dotnet build PCServer/OmniPadServer.sln -c Release

      - name: Run Unit Tests
        run: dotnet test PCServer/OmniPadServer.Tests/OmniPadServer.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish Single-File Self-Contained Binaries
        run: |
          dotnet publish PCServer/OmniPadServer.App/OmniPadServer.App.csproj -c Release -r win-x64 -f net8.0-windows --self-contained true -p:PublishSingleFile=true -o publish/OmniPad-Portable
          Copy-Item -Path "publish/OmniPad-Portable/OmniPadServer.App.exe" -Destination "publish/OmniPad-Portable/OmniPadServer.exe" -Force
          dotnet publish PCServer/OmniPadUpdater.App/OmniPadUpdater.App.csproj -c Release -r win-x64 -f net8.0-windows --self-contained true -p:PublishSingleFile=true -o publish/OmniPad-Portable
          dotnet publish PCServer/OmniPadServer.Legacinator/OmniPadServer.Legacinator.csproj -c Release -r win-x64 -f net8.0-windows --self-contained true -p:PublishSingleFile=true -o publish/OmniPad-Portable
          Copy-Item -Path "OmniPad-Portable/*.bat" -Destination "publish/OmniPad-Portable/" -Force
          Copy-Item -Path "OmniPad-Portable/setup_driver.ps1" -Destination "publish/OmniPad-Portable/" -Force
          if (Test-Path "OmniPad-Portable/README.md") { Copy-Item -Path "OmniPad-Portable/README.md" -Destination "publish/OmniPad-Portable/README_PORTABLE.md" -Force }
          New-Item -ItemType Directory -Path "publish/OmniPad-Portable/WebClient" -Force | Out-Null
          New-Item -ItemType Directory -Path "publish/OmniPad-Portable/wwwroot" -Force | Out-Null
          Copy-Item -Path "WebClient/*" -Destination "publish/OmniPad-Portable/WebClient/" -Recurse -Force
          Copy-Item -Path "WebClient/*" -Destination "publish/OmniPad-Portable/wwwroot/" -Recurse -Force
          if (Test-Path "version.json") { Copy-Item -Path "version.json" -Destination "publish/OmniPad-Portable/" -Force }

      - name: Upload PC Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniPad-Server-win-x64
          path: publish/OmniPad-Portable/
          if-no-files-found: error

  # =========================================================================
  # 2. PC SERVER & UNIT TESTS (LINUX x64 .NET 8)
  # =========================================================================
  build-pc-server-linux:
    name: Build PC Server (Linux x64) & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Linux uinput permissions (if available)
        run: |
          sudo modprobe uinput || true
          if [ -e /dev/uinput ]; then sudo chmod 666 /dev/uinput; fi
          if [ -e /dev/input/uinput ]; then sudo chmod 666 /dev/input/uinput; fi

      - name: Build PCServer Solution (Release - net8.0)
        run: dotnet build PCServer/OmniPadServer.sln -c Release -f net8.0

      - name: Run Unit Tests
        run: dotnet test PCServer/OmniPadServer.Tests/OmniPadServer.Tests.csproj -c Release -f net8.0 --no-build --verbosity normal

      - name: Publish Single-File Self-Contained Linux Binaries
        run: |
          dotnet publish PCServer/OmniPadServer.App/OmniPadServer.App.csproj -c Release -r linux-x64 -f net8.0 --self-contained true -p:PublishSingleFile=true -o publish/OmniPad-Linux-x64
          cp publish/OmniPad-Linux-x64/OmniPadServer.App publish/OmniPad-Linux-x64/OmniPadServer
          chmod +x publish/OmniPad-Linux-x64/OmniPadServer
          dotnet publish PCServer/OmniPadUpdater.App/OmniPadUpdater.App.csproj -c Release -r linux-x64 -f net8.0 --self-contained true -p:PublishSingleFile=true -o publish/OmniPad-Linux-x64
          mkdir -p publish/OmniPad-Linux-x64/WebClient publish/OmniPad-Linux-x64/wwwroot
          cp -r WebClient/* publish/OmniPad-Linux-x64/WebClient/
          cp -r WebClient/* publish/OmniPad-Linux-x64/wwwroot/
          if [ -f "version.json" ]; then cp version.json publish/OmniPad-Linux-x64/; fi
          tar -czvf OmniPad-Linux-x64.tar.gz -C publish OmniPad-Linux-x64

      - name: Upload Linux PC Server Directory Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniPad-Server-linux-x64
          path: publish/OmniPad-Linux-x64/
          if-no-files-found: error

      - name: Upload Linux PC Server Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniPad-Linux-x64-tarball
          path: OmniPad-Linux-x64.tar.gz
          if-no-files-found: error

  # =========================================================================
  # 3. PC SERVER & UNIT TESTS (MACOS ARM64 & x64 DUAL UNIVERSAL .NET 8)
  # =========================================================================
  build-pc-server-macos:
    name: Build PC Server (macOS Universal) & Run Tests
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build PCServer Solution (Release - net8.0)
        run: dotnet build PCServer/OmniPadServer.sln -c Release -f net8.0

      - name: Run Unit Tests
        run: dotnet test PCServer/OmniPadServer.Tests/OmniPadServer.Tests.csproj -c Release -f net8.0 --no-build --verbosity normal

      - name: Publish Self-Contained Binaries (Apple Silicon arm64 & Intel x64)
        run: |
          dotnet publish PCServer/OmniPadServer.App/OmniPadServer.App.csproj -c Release -r osx-arm64 -f net8.0 --self-contained true -p:PublishSingleFile=true -o publish/osx-arm64
          dotnet publish PCServer/OmniPadServer.App/OmniPadServer.App.csproj -c Release -r osx-x64 -f net8.0 --self-contained true -p:PublishSingleFile=true -o publish/osx-x64
          dotnet publish PCServer/OmniPadUpdater.App/OmniPadUpdater.App.csproj -c Release -r osx-arm64 -f net8.0 --self-contained true -p:PublishSingleFile=true -o publish/osx-arm64
          dotnet publish PCServer/OmniPadUpdater.App/OmniPadUpdater.App.csproj -c Release -r osx-x64 -f net8.0 --self-contained true -p:PublishSingleFile=true -o publish/osx-x64

          mkdir -p publish/OmniPad-macOS/WebClient publish/OmniPad-macOS/wwwroot
          cp publish/osx-arm64/OmniPadServer.App publish/OmniPad-macOS/OmniPadServer-arm64
          cp publish/osx-x64/OmniPadServer.App publish/OmniPad-macOS/OmniPadServer-x64
          cp publish/osx-arm64/OmniPadUpdater publish/OmniPad-macOS/OmniPadUpdater-arm64
          cp publish/osx-x64/OmniPadUpdater publish/OmniPad-macOS/OmniPadUpdater-x64
          chmod +x publish/OmniPad-macOS/OmniPadServer-* publish/OmniPad-macOS/OmniPadUpdater-*

          cat << 'EOF' > publish/OmniPad-macOS/OmniPadServer
          #!/usr/bin/env bash
          ARCH=$(uname -m)
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          if [ "$ARCH" = "arm64" ]; then
              exec "$DIR/OmniPadServer-arm64" "$@"
          else
              exec "$DIR/OmniPadServer-x64" "$@"
          fi
          EOF
          chmod +x publish/OmniPad-macOS/OmniPadServer

          cat << 'EOF' > publish/OmniPad-macOS/OmniPadUpdater
          #!/usr/bin/env bash
          ARCH=$(uname -m)
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          if [ "$ARCH" = "arm64" ]; then
              exec "$DIR/OmniPadUpdater-arm64" "$@"
          else
              exec "$DIR/OmniPadUpdater-x64" "$@"
          fi
          EOF
          chmod +x publish/OmniPad-macOS/OmniPadUpdater

          cp -r WebClient/* publish/OmniPad-macOS/WebClient/
          cp -r WebClient/* publish/OmniPad-macOS/wwwroot/
          if [ -f "version.json" ]; then cp version.json publish/OmniPad-macOS/; fi
          tar -czvf OmniPad-macOS.tar.gz -C publish OmniPad-macOS

      - name: Upload macOS PC Server Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniPad-macOS-tarball
          path: OmniPad-macOS.tar.gz
          if-no-files-found: error

  # =========================================================================
  # 4. ANDROID CLIENT (GRADLE / KOTLIN)
  # =========================================================================
  build-android-client:
    name: Build Android Client APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Sync WebClient Assets
        run: |
          mkdir -p AndroidClient/app/src/main/assets/web
          cp -r WebClient/* AndroidClient/app/src/main/assets/web/

      - name: Grant Execute Permission to gradlew
        run: chmod +x AndroidClient/gradlew

      - name: Build Android Debug APK
        working-directory: ./AndroidClient
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniPad-Android-APK
          path: AndroidClient/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # =========================================================================
  # 5. IOS CLIENT (XCODEBUILD / SWIFTUI / UNSIGNED IPA)
  # =========================================================================
  build-ios-client:
    name: Build iOS Client (Swift / IPA)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync WebClient Assets
        run: |
          mkdir -p iOSClient/OmniPad/Resources/Web
          cp -r WebClient/* iOSClient/OmniPad/Resources/Web/

      - name: Build and Archive iOS App (Unsigned)
        run: |
          xcodebuild archive \
            -project iOSClient/OmniPad.xcodeproj \
            -scheme OmniPad \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/OmniPad.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package OmniPad.ipa for Sideloading (AltStore / SideStore / TrollStore)
        run: |
          mkdir -p Payload
          cp -r build/OmniPad.xcarchive/Products/Applications/OmniPad.app Payload/
          zip -r OmniPad.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniPad-iOS-IPA
          path: OmniPad.ipa
          if-no-files-found: error

  # =========================================================================
  # 6. UNIVERSAL BUNDLE PACKAGING & RELEASE
  # =========================================================================
  package-distribution:
    name: Package Universal Portable Release
    needs: [build-pc-server, build-pc-server-linux, build-pc-server-macos, build-android-client, build-ios-client]
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download PC Server Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: OmniPad-Server-win-x64
          path: dist/OmniPad-Portable

      - name: Download Linux PC Server Tarball
        uses: actions/download-artifact@v4
        with:
          name: OmniPad-Linux-x64-tarball
          path: .

      - name: Download macOS PC Server Tarball
        uses: actions/download-artifact@v4
        with:
          name: OmniPad-macOS-tarball
          path: .

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: OmniPad-Android-APK
          path: dist/OmniPad-Portable/apks

      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: OmniPad-iOS-IPA
          path: .

      - name: Rename APK to Standard Name
        run: |
          if (Test-Path "dist/OmniPad-Portable/apks/app-debug.apk") {
            Move-Item -Path "dist/OmniPad-Portable/apks/app-debug.apk" -Destination "dist/OmniPad-Portable/apks/OmniPad.apk" -Force
          }

      - name: Locate Tarballs and IPA for Release
        run: |
          if (Test-Path "OmniPad-Linux-x64-tarball/OmniPad-Linux-x64.tar.gz") {
            Move-Item -Path "OmniPad-Linux-x64-tarball/OmniPad-Linux-x64.tar.gz" -Destination "OmniPad-Linux-x64.tar.gz" -Force
          }
          if (Test-Path "OmniPad-macOS-tarball/OmniPad-macOS.tar.gz") {
            Move-Item -Path "OmniPad-macOS-tarball/OmniPad-macOS.tar.gz" -Destination "OmniPad-macOS.tar.gz" -Force
          }
          if (Test-Path "OmniPad-iOS-IPA/OmniPad.ipa") {
            Move-Item -Path "OmniPad-iOS-IPA/OmniPad.ipa" -Destination "OmniPad.ipa" -Force
          }

      - name: Compress Release Bundle (ZIP)
        run: |
          Compress-Archive -Path "dist/OmniPad-Portable/*" -DestinationPath "OmniPad-Portable.zip" -CompressionLevel Optimal

      - name: Upload Complete Distribution ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OmniPad-Portable-Universal
          path: OmniPad-Portable.zip
          if-no-files-found: error

      - name: Copy Standalone APK for Release
        run: |
          if (Test-Path "dist/OmniPad-Portable/apks/OmniPad.apk") {
            Copy-Item -Path "dist/OmniPad-Portable/apks/OmniPad.apk" -Destination "OmniPad.apk" -Force
          }

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "OmniPad ${{ github.ref_name }}"
          files: |
            OmniPad-Portable.zip
            OmniPad-Linux-x64.tar.gz
            OmniPad-macOS.tar.gz
            OmniPad.apk
            OmniPad.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
